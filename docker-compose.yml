services:
  web:
    build: "."
    image: "notes:latest"
    ports:
      - "8080:8080"
    volumes:
      - "./:/var/www/html"
    command: 'sh -c "composer install && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && supervisord -c /etc/supervisor/conf.d/supervisord.conf"'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: "mariadb"
    restart: "always"
    environment:
      MARIADB_DATABASE: "tm-notes"
      MARIADB_USER: "root"
      MARIADB_ROOT_PASSWORD: "Pas_W0rd"
    ports:
      - "3306:3306"
    volumes:
      - "./var/lib/mysql:/var/lib/mysql:rw"
    user: mysql
    healthcheck:
      # TCP only comes up once the entrypoint's init phase is done
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pPas_W0rd"]
      interval: 2s
      timeout: 5s
      retries: 30

  node:
    build:
      context: "./docker"
      dockerfile: "node.Dockerfile"
    image: "notes-node:latest"
    user: "node"
    working_dir: /home/node/app
    ports:
      - "3000:3000"
    volumes:
      - "./notes-frontend:/home/node/app"
    environment:
      # Forwarded only when set on the host; otherwise notes-frontend/.env applies.
      - VITE_API_BASE_URL
    command: 'sh -c "npm install && npm start"'
